services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-please-use-64-characters}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - product-service
      - user-service
  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
  user-service:
    build: ./user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-please-use-64-characters}
    ports:
      - "8082:8082"
